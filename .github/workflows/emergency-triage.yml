name: Emergency triage tests

on:
  pull_request:
    paths:
      - "lib/emergency-triage.*"
      - "tests/emergency-triage.test.mjs"
      - ".github/workflows/emergency-triage.yml"
  push:
    branches:
      - feature/help-ai-emergency-center
    paths:
      - "lib/emergency-triage.*"
      - "tests/emergency-triage.test.mjs"
      - ".github/workflows/emergency-triage.yml"

permissions:
  contents: read

jobs:
  emergency-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline classifier safety tests
        run: node --test tests/emergency-triage.test.mjs

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript without the Next.js build-error bypass
        run: pnpm exec tsc --noEmit
